{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops! encontramos um erro inesperado</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--gray-100);
            padding: 20px;
        }

        .error-card {
            background-color: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            border-top: 4px solid var(--danger-color);
        }

        .error-icon {
            font-size: 64px;
            color: var(--danger-color);
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions .btn {
            min-width: 140px;
        }

        @media (max-width: 768px) {
            .error-card {
                padding: 30px 20px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-icon {
                font-size: 48px;
            }

            .error-actions {
                flex-direction: column;
                align-items: center;
            }

            .error-actions .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="error-title">Ops! Encontramos um erro inesperado</h1>
            <p class="error-message">
                Algo deu errado durante o processamento da sua solicitação. 
                Nossa equipe foi notificada e estamos trabalhando para resolver o problema.
            </p>
            <div class="error-actions">
                <button class="btn primary" onclick="window.history.back()">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
                <button class="btn secondary" onclick="window.location.href='/'">
                    <i class="fas fa-home"></i> Início
                </button>
            </div>
        </div>
    </div>
</body>
</html>
